<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="weather-container">
        <div class="search-container">
            <input type="text" id="location-input" placeholder="Enter city name...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="location-btn"><i class="fa-solid fa-location-dot"></i></button>
        </div>

        <div class="weather-card">
            <div class="weather-header">
                <h1 id="city-name">--</h1>
                <p id="current-date">--</p>
            </div>

            <div class="weather-main">
                <div class="temperature-section">
                    <div id="weather-icon"><i class="wi wi-day-sunny"></i></div>
                    <div id="temperature">--°C</div>
                </div>
                <div id="weather-description">--</div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <i class="wi wi-humidity"></i>
                    <span id="humidity">--%</span>
                    <p>Humidity</p>
                </div>
                <div class="detail-item">
                    <i class="wi wi-strong-wind"></i>
                    <span id="wind-speed">-- km/h</span>
                    <p>Wind</p>
                </div>
                <div class="detail-item">
                    <i class="wi wi-barometer"></i>
                    <span id="pressure">-- hPa</span>
                    <p>Pressure</p>
                </div>
            </div>

            <div class="forecast-container" id="forecast">
                <!-- Forecast items will be added here by JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
